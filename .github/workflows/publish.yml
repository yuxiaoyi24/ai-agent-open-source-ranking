name: Refresh and publish dashboard

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish.yml"
      - "agent_landscape/**"
      - "config/**"
      - "data/**"
      - "reports/weekly/**"
      - "scripts/**"
      - "tests/**"
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh GitHub data before publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: agent-ranking-pages
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name == 'schedule' || inputs.refresh
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh weekly rankings
        if: github.event_name == 'schedule' || inputs.refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_agent_landscape.py --discover

      - name: Build mini program data
        if: github.event_name == 'schedule' || inputs.refresh
        run: python3 scripts/build_miniprogram_data.py

      - name: Run tests
        if: github.event_name == 'schedule' || inputs.refresh
        run: python3 -m unittest discover -s tests -v

      - name: Save weekly snapshot
        if: github.event_name == 'schedule' || inputs.refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/miniprogram data/rankings data/snapshots reports/weekly wechat-miniprogram/miniprogram/data/rankings.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh weekly rankings $(TZ=Asia/Shanghai date +%F)"
            git push
          fi

      - name: Prepare static site
        run: |
          mkdir -p _site/data _site/history
          cp reports/weekly/latest.html _site/index.html
          cp data/miniprogram/latest.json _site/data/latest.json
          find reports/weekly -name '*-agent-open-source-ranking.html' -exec cp {} _site/history/ \;
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
